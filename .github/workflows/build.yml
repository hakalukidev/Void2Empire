name: Build images

# Every merge to main produces a deployable image, but nothing goes live
# until Deploy is run by hand. Required-reviewer gates on an environment
# need a paid plan for private repos; a manually triggered deploy gives the
# same "no release without a human" property for free.
on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/hakalukidev/void2empire-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/hakalukidev/void2empire-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://void2empire.com/api
            NEXT_PUBLIC_WS_URL=wss://void2empire.com/ws
          tags: |
            ${{ env.REGISTRY }}/hakalukidev/void2empire-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/hakalukidev/void2empire-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Summary
        run: |
          {
            echo "### Ready to deploy"
            echo
            echo 'Actions > Deploy > Run workflow, tag `${{ github.sha }}`'
            echo '(or leave the tag blank to deploy the head of main).'
          } >> "$GITHUB_STEP_SUMMARY"
